name: Release

# Publishes the @gw2kit libraries (client, wiki, recipes), @gw2-ai/core and
# the three MCP servers to npm when a version tag (v0.1.0, ...) is pushed.
# Every package's version must match the tag, and .claude-plugin/plugin.json
# must pin the same version for the servers; the check step enforces both.
#
# Authentication is npm trusted publishing (OIDC): no token is stored. Each
# package on npmjs.com needs a trusted publisher for this repository and this
# workflow file (Settings → Trusted publishing → GitHub Actions →
# ChristopherDavenport/gw2-ai, release.yml). A package has to exist before
# that can be set, so the first version of each is published by hand after
# `npm login`.
#
# npm adds provenance attestations automatically when publishing this way,
# but only from public repositories.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing exchanges this OIDC token for a publish credential

env:
  # Dependency order: each package is published after the ones it depends on.
  PACKAGES: client wiki recipes core mcp-account mcp-data mcp-wiki

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - name: Check versions match the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          status=0
          for pkg in $PACKAGES; do
            v=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$v" != "$version" ]; then echo "packages/$pkg is $v, tag is $version"; status=1; fi
          done
          for server in mcp-account mcp-data mcp-wiki; do
            grep -q "@gw2-ai/$server@$version\"" .claude-plugin/plugin.json \
              || { echo "plugin.json does not pin @gw2-ai/$server@$version"; status=1; }
          done
          exit $status

      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test

      # pnpm pack turns workspace:* dependencies into the real versions; npm
      # publishes the tarballs, since npm is what implements trusted publishing.
      - name: Pack
        run: |
          for pkg in $PACKAGES; do
            pnpm --dir "packages/$pkg" pack --pack-destination "$RUNNER_TEMP/pack/$pkg"
          done

      # Versions already on npm are skipped, so a run that failed partway can be re-run.
      - name: Publish
        run: |
          for pkg in $PACKAGES; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published; skipping"
              continue
            fi
            npm publish "$RUNNER_TEMP/pack/$pkg"/*.tgz --access public
          done
